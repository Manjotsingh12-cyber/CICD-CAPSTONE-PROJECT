<!DOCTYPE html>
<html>
<head>
    <title>billing-payment</title>
    <meta http-equiv="refresh" content="0">
    <style>
        body { font-family: -apple-system, monospace; background: #0d1117; color: #c9d1d9; padding: 40px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 24px; max-width: 420px; }
        .row { margin: 10px 0; display: flex; justify-content: space-between; }
        .label { color: #8b949e; }
        .pill { padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; }
        .pill.ok { background: #1a3a1f; color: #3fb950; }
        .pill.bad { background: #3a1a1a; color: #f85149; }
        .pill.wait { background: #2d2a1a; color: #d4a72c; }
        h2 { margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.ok { background: #3fb950; }
        .dot.bad { background: #f85149; }
        .dot.wait { background: #d4a72c; }
        .ts { color: #484f58; font-size: 12px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h2><span class="dot wait" id="dot"></span> billing-payment</h2>
        <div class="row"><span class="label">Health</span> <span class="pill wait" id="status">checking...</span></div>
        <div class="row"><span class="label">Version</span> <span>{{ version }}</span></div>
        <div class="row"><span class="label">Git SHA</span> <span>{{ git_sha }}</span></div>
        <div class="row"><span class="label">Build</span> <span>#{{ build_number }}</span></div>
        <div class="row"><span class="label">Environment</span> <span>{{ environment }}</span></div>
        <div class="ts" id="ts"></div>
    </div>
    <script>
        async function poll() {
            const dot = document.getElementById("dot");
            const status = document.getElementById("status");
            const ts = document.getElementById("ts");
            try {
                const r = await fetch("/health", { cache: "no-store" });
                const d = await r.json();
                const ok = r.ok && d.status === "ok";
                dot.className = "dot " + (ok ? "ok" : "bad");
                status.className = "pill " + (ok ? "ok" : "bad");
                status.innerText = ok ? "healthy" : "unhealthy";
            } catch (e) {
                dot.className = "dot bad";
                status.className = "pill bad";
                status.innerText = "unreachable";
            }
            ts.innerText = "Last checked: " + new Date().toLocaleTimeString();
        }
        poll();
        setInterval(poll, 5000);
    </script>
</body>
</html>
